<section id="faq" class="bg-white py-24 lg:py-32">
  <div class="mx-auto max-w-3xl px-6 lg:px-8">
    <div class="reveal text-center" x-intersect.once="$el.classList.add('is-visible')">
      <span class="text-sm font-semibold uppercase tracking-widest text-accent-600">FAQ</span>
      <h2 class="mt-3 font-display text-3xl font-bold tracking-tight text-brand-950 md:text-4xl">Questions hospitals ask us</h2>
    </div>

    <div class="mt-12 divide-y divide-brand-900/10 rounded-2xl border border-brand-900/10">
      {% for q, a in faqs %}
      <div x-data="{ open: false }" class="p-6">
        <button @click="open = !open" class="flex w-full items-center justify-between text-left">
          <span class="font-display text-base font-semibold text-brand-950">{{ q }}</span>
          <i data-lucide="chevron-down" class="h-5 w-5 shrink-0 text-brand-900/50 transition-transform" :class="open && 'rotate-180'"></i>
        </button>
        <div x-show="open" x-cloak x-transition class="mt-3 text-sm leading-relaxed text-brand-900/70">{{ a }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
