<div class="reveal group rounded-2xl border border-brand-900/10 bg-white p-6 transition hover:-translate-y-1 hover:shadow-xl hover:shadow-brand-900/5" x-intersect.once="$el.classList.add('is-visible')">
  <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-50 text-brand-700 transition group-hover:bg-brand-800 group-hover:text-white">
    <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
  </span>
  <h3 class="mt-4 font-display text-base font-bold text-brand-950">{{ title }}</h3>
  <p class="mt-2 text-sm leading-relaxed text-brand-900/65">{{ desc }}</p>
</div>
