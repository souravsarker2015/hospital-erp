{% extends "base_public.html" %}

{% block title %}Password updated — Wardline{% endblock %}

{% block content %}
<div class="w-full max-w-sm text-center">
  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
    <i data-lucide="check-circle-2" class="h-7 w-7"></i>
  </span>
  <h1 class="mt-6 font-display text-2xl font-bold tracking-tight text-brand-950">Password updated</h1>
  <p class="mt-3 text-sm text-brand-900/60">Your password has been changed. You can log in with it now.</p>
  <a href="{% url 'users:login' %}" class="mt-8 inline-flex items-center justify-center gap-2 rounded-lg bg-accent-500 px-6 py-3.5 text-base font-semibold text-white shadow-lg shadow-accent-900/15 transition hover:bg-accent-600">
    Log in
    <i data-lucide="arrow-right" class="h-4 w-4"></i>
  </a>
</div>
{% endblock %}
