{% extends "base_public.html" %}

{% block title %}Check your email — Wardline{% endblock %}

{% block content %}
<div class="w-full max-w-sm text-center">
  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-brand-100 text-brand-700">
    <i data-lucide="mail-check" class="h-7 w-7"></i>
  </span>
  <h1 class="mt-6 font-display text-2xl font-bold tracking-tight text-brand-950">Check your email</h1>
  <p class="mt-3 text-sm text-brand-900/60">
    If an account exists with that email, we've sent a link to reset your password. It expires soon, so use it shortly.
  </p>
  <p class="mt-6 text-center text-xs text-brand-900/40">
    <a href="{% url 'users:login' %}" class="underline hover:text-brand-900">&larr; Back to log in</a>
  </p>
</div>
{% endblock %}
