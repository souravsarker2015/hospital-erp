{% if results %}
<div class="divide-y divide-brand-900/5 rounded-lg border border-brand-900/10 bg-white">
  {% for patient in results %}
  <button type="button"
    @click="selectedPatientId = '{{ patient.id }}'; selectedPatientLabel = '{{ patient.full_name|escapejs }} ({{ patient.mrn }})'"
    class="block w-full px-3.5 py-2.5 text-left text-sm transition hover:bg-brand-50">
    <span class="font-medium text-brand-950">{{ patient.full_name }}</span>
    <span class="ml-2 text-xs text-brand-900/40">{{ patient.mrn }} · {{ patient.phone_number }}</span>
  </button>
  {% endfor %}
</div>
{% elif query %}
<p class="px-1 text-xs text-brand-900/40">
  No patients found. <a href="{% url 'patients:create' %}" class="underline hover:text-brand-900">Register a new patient</a>.
</p>
{% endif %}
